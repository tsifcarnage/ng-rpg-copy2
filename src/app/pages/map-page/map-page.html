@if (gameManagerService.isInit) {

@let player = gameManagerService.currentPlayer;

<app-game-header
  [lvl]="player.lvl"
  [money]="player.money"
  [pseudo]="player.pseudo">
</app-game-header>

<div class="container">
  <app-player-summary></app-player-summary>
</div>

<div class="map-section">
  <app-map-selector></app-map-selector>
</div>
} @else {
<div class="container">
  <h1>ERRROR</h1>
</div>
}

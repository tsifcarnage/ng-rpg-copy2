<div class="actions-wrapper">
  <div class="action-group common-actions">
    <button [disabled]="disabled()" (click)="playerAtk.emit()" class="action-btn primary">
      <span class="btn-icon">🗡️</span>
      <span class="btn-label">Attaque</span>
    </button>
    <button [disabled]="disabled()" class="action-btn danger">
      <span class="btn-icon">🏃‍♀️</span>
      <span class="btn-label">Fuir</span>
    </button>
  </div>

  <div class="action-group">
    <h4 class="group-title">✨ Compétences</h4>
    <div class="group-grid">
      @for (item of typeActions; track item.name) {
      <button [disabled]="disabled()" class="action-btn skill">
        <span class="btn-icon">{{item.icon}}</span>
        <span class="btn-label">{{item.name}}</span>
        <span class="btn-cost">{{item.cost}} PM</span>
      </button>
      }
    </div>
  </div>

  <div class="action-group">
    <h4 class="group-title">🎒 Inventaire</h4>
    <div class="group-grid">
      @for (item of inventoryActions; track item.name) {
      <button [disabled]="disabled()" class="action-btn item">
        <span class="btn-icon">{{item.icon}}</span>
        <span class="btn-label">{{item.name}}</span>
        <span class="btn-cost qty">x{{item.qty}}</span>
      </button>
      }
    </div>
  </div>
</div>

<div class="container">
  <div class="logo-wrap">
    <img src="https://www.svgrepo.com/show/299919/katana-sword.svg" />
  </div>
  <h1 class="title-contrast">Chronicles of Angular</h1>
  <p class="subtitle">Un RPG au tour par tour</p>
  <div class="landing-button" routerLink="/create-character">✨ Nouvelle partie</div>

  @for(player of playerService.retrievePlayers(); track player.pseudo) {
    <div class="landing-button" (click)="initGameWithSavedPlayer(player)">
      💾 {{player.pseudo}} - lvl {{player.lvl}} -{{player.name}}
    </div>
  }

  <div class="features-list">
    <div class="feature-item">⚔️ Combat au tour par tour</div>
    <div class="feature-item">🧙‍♀️ 3 classes jouables</div>
    <div class="feature-item">🌳 3 zones d'exploration</div>
    <div class="feature-item">🛍️ Inventaire et boutiques</div>
  </div>
</div>

@if (gameManagerService.isInit) {

@let player = gameManagerService.currentPlayer;

<app-game-header [lvl]="player.lvl" [money]="player.money" [pseudo]="player.pseudo">
</app-game-header>

<div class="fight-main">
  <app-fight-character-card [isPlayer]="true"></app-fight-character-card>
  <h2>VS</h2>
  <app-fight-character-card [isPlayer]="false"></app-fight-character-card>
</div>


<app-fight-history></app-fight-history>

<app-fight-actions></app-fight-actions>

} @else {
<div class="container">
  <h1>ERRROR</h1>
</div>
}

<div class="card" (click)="cardSelected.emit()">
  <div class="card-body">
    <p class="card-icon">{{IconByType[item().type]}}</p>
    <h3 class="subtitle-contrast">{{item().name}}</h3>
    <p class="smaller">{{item().description}}</p>
  </div>
  <div class="pill-container">
    @for (feature of item().features; track $index) {
    <p class="pill">{{feature}}</p>
    }
  </div>
</div>
